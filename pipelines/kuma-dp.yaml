# Kuma DP / Envoy access log
sourceId: "kuma-dp"
fingerprint: ""           # wildcard — applies to any fingerprint for this sourceId
family: "json"
ocsfClass: 4002
description: "Kuma DP / Envoy access log"
sample: "[2024-08-12T12:00:00.123Z] default \"GET /api/items HTTP/1.1\" 200 - 0 1456 12 11 \"-\" \"curl/8.0.1\" \"abcd1234-5678-90ef-1234-567890abcdef\" \"items.svc:8080\" \"frontend_kuma-demo_svc_8080\" \"items_kuma-demo_svc_8080\" \"10.244.1.5\" \"10.244.2.7:8080\""
vrl: |
    # Kuma DP (Envoy access log via traffic-log policy) -> OCSF 4002 HTTP Activity
    src = .
    parsed = {}
    is_json = false
    if is_string(.message) {
      msg_str = string!(.message)
      ok, err = parse_json(msg_str)
      if err == null && is_object(ok) {
        parsed = object!(ok)
        is_json = true
      }
    }

    . = {}

    .class_uid = 4002
    .metadata = {"product": {"name": "Kuma", "vendor_name": "Kuma"}, "version": "1.5.0"}

    ts = null
    .activity_id = 1
    .severity_id = 1

    method = ""
    path = ""
    proto = ""
    status = 0
    src_addr = ""
    dst_addr = ""
    authority = ""
    src_svc = ""
    dst_svc = ""
    bin = null
    bout = null
    dur_ms = null
    have_status = false
    ua = ""
    xff = ""
    mesh = ""

    if is_json {
      ts = parsed.start_time
      method = to_string(parsed.method) ?? ""
      path = to_string(parsed.path) ?? ""
      proto = to_string(parsed.protocol) ?? ""
      authority = to_string(parsed.authority) ?? ""
      src_svc = to_string(parsed.source) ?? ""
      dst_svc = to_string(parsed.destination) ?? ""
      src_addr = to_string(parsed.source_address) ?? ""
      dst_addr = to_string(parsed.destination_address) ?? ""
      s, _ = to_int(parsed.response_code)
      if s != null { status = s; have_status = true }
      binv, _ = to_int(parsed.bytes_received)
      if binv != null { bin = binv }
      boutv, _ = to_int(parsed.bytes_sent)
      if boutv != null { bout = boutv }
      durv, _ = to_int(parsed.duration_millis)
      if durv != null { dur_ms = durv }
    } else {
      raw = to_string(src.message) ?? ""
      # HTTP-style envoy: [TS] mesh "method path proto" status flags bin bout durx ust "xff" "ua" "rid" "authority" "src_svc" "dst_svc" "src_addr" "dst_addr"
      m, e = parse_regex(raw, r'^\[(?P<ts>[^\]]+)\] (?P<mesh>\S+) "(?P<method>\S+) (?P<path>\S+) (?P<proto>[^"]+)" (?P<status>\d+) (?P<flags>\S+) (?P<bin>\d+) (?P<bout>\d+) (?P<dur>\d+) (?P<ust>\S+) "(?P<xff>[^"]*)" "(?P<ua>[^"]*)" "(?P<rid>[^"]*)" "(?P<authority>[^"]*)" "(?P<srcsvc>[^"]*)" "(?P<dstsvc>[^"]*)" "(?P<srcaddr>[^"]*)" "(?P<dstaddr>[^"]*)"')
      if e == null {
        parsed_ts, terr = parse_timestamp(m.ts, "%+")
        if terr == null { ts = parsed_ts }
        mesh = m.mesh
        method = m.method
        path = m.path
        proto = m.proto
        s, _ = to_int(m.status)
        if s != null { status = s; have_status = true }
        binv, _ = to_int(m.bin)
        if binv != null { bin = binv }
        boutv, _ = to_int(m.bout)
        if boutv != null { bout = boutv }
        durv, _ = to_int(m.dur)
        if durv != null { dur_ms = durv }
        xff = m.xff
        ua = m.ua
        authority = m.authority
        src_svc = m.srcsvc
        dst_svc = m.dstsvc
        src_addr = m.srcaddr
        dst_addr = m.dstaddr
      } else {
        # TCP-style: [TS] - mesh srcip(srcsvc)->dstip:port(dstsvc) took Xms, sent N bytes, received: M bytes
        tm, terr2 = parse_regex(raw, r'^\[(?P<ts>[^\]]+)\] - (?P<mesh>\S+) (?P<srcip>[^\(]+)\((?P<srcsvc>[^)]+)\)->(?P<dstaddr>[^\(]+)\((?P<dstsvc>[^)]+)\) took (?P<dur>\d+)ms, sent (?P<sent>\d+) bytes, received: (?P<recv>\d+) bytes')
        if terr2 == null {
          parsed_ts, perr = parse_timestamp(tm.ts, "%+")
          if perr == null { ts = parsed_ts }
          mesh = tm.mesh
          src_addr = tm.srcip
          dst_addr = tm.dstaddr
          src_svc = tm.srcsvc
          dst_svc = tm.dstsvc
          durv, _ = to_int(tm.dur)
          if durv != null { dur_ms = durv }
          sentv, _ = to_int(tm.sent)
          if sentv != null { bout = sentv }
          recvv, _ = to_int(tm.recv)
          if recvv != null { bin = recvv }
          .class_uid = 4001
        }
      }
    }

    if have_status {
      if status >= 500 { .severity_id = 4 }
      if status >= 400 && status < 500 { .severity_id = 3 }
    }

    if ts == null { ts = src.timestamp }
    if ts == null { ts = now() }
    .time = ts

    .http_request = {
      "method": method,
      "url": {"path": path, "hostname": authority},
      "version": proto,
      "user_agent": ua
    }
    .http_response = {"status_code": status, "length": bout}
    .src_endpoint = {"ip": src_addr, "service": src_svc}
    .dst_endpoint = {"ip": dst_addr, "service": dst_svc}
    .traffic = {"bytes_in": bin, "bytes_out": bout}
    .dur_ms = dur_ms
    .mesh = mesh
    .message = src.message
