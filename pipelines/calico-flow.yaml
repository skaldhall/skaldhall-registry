# Calico flow logs
sourceId: "calico-flow"
fingerprint: ""           # wildcard — applies to any fingerprint for this sourceId
family: "json"
ocsfClass: 4001
description: "Calico flow logs"
sample: "{\"start_time\":1597166083,\"end_time\":1597166383,\"source_ip\":\"192.168.47.9\",\"source_name\":\"access-6b687c8dcb-zn5s2\",\"source_name_aggr\":\"access-6b687c8dcb-*\",\"source_namespace\":\"policy-demo\",\"source_port\":42106,\"source_type\":\"wep\",\"source_labels\":{\"labels\":[\"pod-template-hash=6b687c8dcb\",\"app=access\"]},\"dest_ip\":\"192.168.138.79\",\"dest_name\":\"nginx-86c57db685-h6792\",\"dest_name_aggr\":\"nginx-86c57db685-*\",\"dest_namespace\":\"policy-demo\",\"dest_port\":80,\"dest_type\":\"wep\",\"dest_labels\":{\"labels\":[\"pod-tem"
vrl: |
    # Calico flow log -> OCSF 4001 Network Activity
    src = .
    parsed = {}
    if is_string(.message) {
      ok, err = parse_json(.message)
      if err == null && is_object(ok) { parsed = object!(ok) }
    }

    . = {}

    .class_uid = 4001
    .metadata = {"product": {"name": "Calico", "vendor_name": "Tigera"}, "version": "1.5.0"}

    # Time: prefer end_time epoch seconds
    t = parsed.end_time
    if t == null { t = parsed.start_time }
    if t == null { t = src.timestamp }
    if t == null { t = now() }
    .time = t
    .start_time = parsed.start_time
    .end_time = parsed.end_time

    # Action -> activity / severity
    action = to_string(parsed.action) ?? ""
    .activity_id = 0
    .severity_id = 1
    if action == "allow" { .activity_id = 1; .severity_id = 1 }
    if action == "deny"  { .activity_id = 5; .severity_id = 4 }
    if action == "pass"  { .activity_id = 1; .severity_id = 1 }

    # Endpoints
    .src_endpoint = {
      "ip": parsed.source_ip,
      "port": parsed.source_port,
      "name": parsed.source_name,
      "namespace": parsed.source_namespace,
      "type": parsed.source_type,
      "labels": parsed.source_labels
    }
    .dst_endpoint = {
      "ip": parsed.dest_ip,
      "port": parsed.dest_port,
      "name": parsed.dest_name,
      "namespace": parsed.dest_namespace,
      "type": parsed.dest_type,
      "labels": parsed.dest_labels
    }

    # Protocol
    .connection_info = {"protocol_name": parsed.proto}

    # Traffic counters
    .traffic = {
      "bytes_in": parsed.bytes_in,
      "bytes_out": parsed.bytes_out,
      "packets_in": parsed.packets_in,
      "packets_out": parsed.packets_out
    }

    .num_flows = parsed.num_flows
    .num_flows_started = parsed.num_flows_started
    .num_flows_completed = parsed.num_flows_completed
    .reporter = parsed.reporter
    .policies = parsed.policies
    .host_name = parsed.host
    .http_requests_allowed_in = parsed.http_requests_allowed_in
    .http_requests_denied_in = parsed.http_requests_denied_in
    .original_source_ips = parsed.original_source_ips
    .num_original_source_ips = parsed.num_original_source_ips
    .source_name_aggr = parsed.source_name_aggr
    .dest_name_aggr = parsed.dest_name_aggr

    m = src.message
    .message = m
