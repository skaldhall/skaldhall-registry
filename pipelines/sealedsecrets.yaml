# Sealed Secrets controller log (klog)
sourceId: "sealedsecrets"
fingerprint: ""           # wildcard — applies to any fingerprint for this sourceId
family: "klog"
ocsfClass: 6002
description: "Sealed Secrets controller log (klog)"
sample: "I0812 13:00:00.123456       1 main.go:267] Starting sealed-secrets controller version: v0.26.2"
vrl: |
    src = .

    line = to_string(.message) ?? ""

    mr, merr = parse_regex(line, r'^(?P<lvl>[IWEF])(?P<mmdd>\d{4}) (?P<time>\d{2}:\d{2}:\d{2}\.\d+)\s+(?P<pid>\d+)\s+(?P<file>\S+):(?P<lineno>\d+)\] (?P<msg>.*)$')
    m = {}
    if merr == null {
      m = mr
    }

    . = {}

    lvl_v, _ = get(m, ["lvl"])
    mmdd_v, _ = get(m, ["mmdd"])
    time_v, _ = get(m, ["time"])
    pid_v, _ = get(m, ["pid"])
    file_v, _ = get(m, ["file"])
    lineno_v, _ = get(m, ["lineno"])
    msg_v, _ = get(m, ["msg"])

    lvl = to_string(lvl_v) ?? "I"
    sev = 1
    if lvl == "I" { sev = 1 }
    if lvl == "W" { sev = 3 }
    if lvl == "E" { sev = 4 }
    if lvl == "F" { sev = 5 }

    msg_str = to_string(msg_v) ?? ""
    if msg_str == "" { msg_str = line }
    msg_l = downcase(msg_str)

    # 6002 = Application Lifecycle
    .class_uid = 6002

    activity = 0
    if contains(msg_l, "starting") { activity = 3 }
    if contains(msg_l, "serving") { activity = 3 }
    if contains(msg_l, "updating") { activity = 8 }
    if contains(msg_l, "unsealed") { activity = 1 }
    if contains(msg_l, "generating") { activity = 1 }
    if contains(msg_l, "written") { activity = 1 }
    if contains(msg_l, "failed to unseal") { activity = 0 }
    if contains(msg_l, "error") { activity = 0 }
    .activity_id = activity
    .severity_id = sev

    mmdd = to_string(mmdd_v) ?? ""
    time_str = to_string(time_v) ?? ""
    ts = now()
    if mmdd != "" && time_str != "" {
      yr = format_timestamp!(now(), format: "%Y")
      composed = yr + "-" + slice!(mmdd, 0, 2) + "-" + slice!(mmdd, 2, 4) + "T" + time_str + "Z"
      ts = parse_timestamp(composed, format: "%+") ?? now()
    }
    .time = ts

    .metadata = {
      "product": {"name": "sealed-secrets", "vendor_name": "Bitnami Labs"},
      "version": "1.5.0",
      "uid": ""
    }

    # Try to parse SealedSecret event lines for a target entity
    ev, ev_err = parse_regex(msg_str, r'Kind:"(?P<kind>[^"]+)",\s*Namespace:"(?P<ns>[^"]*)",\s*Name:"(?P<name>[^"]*)"(?:,\s*UID:"(?P<uid>[^"]*)")?')
    ev_kind = ""
    ev_ns = ""
    ev_name = ""
    ev_uid = ""
    if ev_err == null {
      ek, _ = get(ev, ["kind"])
      en, _ = get(ev, ["ns"])
      enm, _ = get(ev, ["name"])
      eu, _ = get(ev, ["uid"])
      ev_kind = to_string(ek) ?? ""
      ev_ns = to_string(en) ?? ""
      ev_name = to_string(enm) ?? ""
      ev_uid = to_string(eu) ?? ""
    }

    .entity = {
      "type": ev_kind,
      "name": ev_name,
      "namespace": ev_ns,
      "uid": ev_uid
    }

    .message = msg_str

    .process = {
      "pid": to_int(pid_v) ?? 0,
      "name": "sealed-secrets-controller"
    }
    .log = {
      "file": to_string(file_v) ?? "",
      "line": to_int(lineno_v) ?? 0,
      "level": lvl
    }
    .raw_data = line
