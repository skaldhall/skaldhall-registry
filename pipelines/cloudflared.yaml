# Cloudflare Tunnel (cloudflared) request/response DEBUG logs -> OCSF 4002 HTTP Activity
#
# cloudflared at --loglevel debug logs each proxied request as TWO lines:
#   REQUEST  : "<ts> DBG GET https://host/path HTTP/1.1 ... headers={...} host=.. path=.."
#   RESPONSE : "<ts> DBG 200 OK connIndex=0 event=1 ... originService=.."
# There is NO per-request id shared by both lines (Cf-Ray is request-only), so
# the VRL parses each line into its half of the event — request lines carry the
# client IP (Cf-Connecting-Ip), country, method, path, host, UA; response lines
# carry the status (2xx/3xx info, 4xx medium, 5xx high) — and the pipeline's
# `reduce:` stage below MERGES the pair into ONE stored event per call.
# Unpaired halves (missed line, tunnel restart) still surface alone, so the
# 401/403/429/5xx Sigma rules always have a status-bearing event to fire on.
# Every other cloudflared line (startup/health/operational) is dropped.
sourceId: "cloudflared"
fingerprint: ""           # wildcard — any fingerprint for this sourceId
family: "regex"
ocsfClass: 4002
emits: [4002]
# Merge the request/response line pair into ONE stored event. cloudflared gives
# the two lines no shared id, so the pipeline pairs them statefully instead:
# group by the tunnel connection (connection_info.uid = connIndex), a request
# line opens a group (starts_when), the following response on that connection
# merges into it, and unpaired halves flush alone after expire_after_ms.
# Under parallel in-flight requests on one connection (HTTP/2 multiplexing)
# a status can attach to the adjacent request — approximate by construction,
# exact whenever requests are sequential. merge_strategies pin the fields both
# halves carry (numbers otherwise SUM across the pair); severity takes the max
# so an error response elevates the merged event; raw_data keeps both lines.
reduce:
  group_by: ["connection_info.uid"]
  starts_when: "exists(.http_request.http_method)"
  expire_after_ms: 3000
  merge_strategies:
    severity_id: max
    class_uid: discard
    activity_id: discard
    status_code: max
    raw_data: concat_newline
    connection_info.direction_id: discard
description: "Cloudflare Tunnel (cloudflared) HTTP request/response debug logs -> OCSF HTTP Activity (request+response merged per call)"
sample: '2026-07-23T12:44:42Z DBG GET https://example.info/s HTTP/1.1 connIndex=0 content-length=0 event=1 headers={"Accept":["text/html"],"Cf-Connecting-Ip":["95.67.17.210"],"Cf-Ipcountry":["UA"],"Cf-Ray":["a1fac72a5ed0a541-VIE"],"User-Agent":["Mozilla/5.0"]} host=example.info ingressRule=0 originService=http://127.0.0.1:4000 path=/s'
vrl: |
    src = .
    msg = to_string(.message) ?? ""
    . = {}
    .class_uid = 4002
    .metadata = {"product": {"name": "cloudflared", "vendor_name": "Cloudflare"}, "version": "1.5.0", "log_name": "cloudflare-tunnel"}

    # Log-line timestamp (RFC3339 at the start); fall back to ingest time.
    tsm = parse_regex(msg, r'^(?P<ts>\S+)\s') ?? {}
    pt, perr = parse_timestamp(to_string(tsm.ts), "%+")
    if perr == null {
      .time = pt
    } else {
      ft = src.timestamp
      if ft == null { ft = now() }
      .time = ft
    }

    # Classify: a REQUEST line has "<METHOD> https://…"; a RESPONSE line has
    # "DBG <status> …". These patterns never cross-match.
    reqm  = parse_regex(msg, r'\s(?P<method>GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS|TRACE|CONNECT)\s+https?://') ?? {}
    respm = parse_regex(msg, r'\sDBG\s+(?P<status>[1-5]\d\d)\s') ?? {}

    # Tunnel connection id — the reduce stage groups request/response pairs on
    # it (OCSF connection_info.uid). Both line kinds carry connIndex=N.
    connm = parse_regex(msg, r'\sconnIndex=(?P<v>\d+)') ?? {}
    conn_uid = "0"
    if exists(connm.v) { conn_uid = to_string(connm.v) }

    if exists(reqm.method) {
      method = upcase(to_string(reqm.method))
      # activity_id per the OCSF 4002 catalog (NOT the HTTP verb order):
      # Connect=1, Delete=2, Get=3, Head=4, Options=5, Post=6, Put=7, Trace=8, Patch=9.
      .activity_id = 0
      if method == "CONNECT" { .activity_id = 1 }
      if method == "DELETE"  { .activity_id = 2 }
      if method == "GET"     { .activity_id = 3 }
      if method == "HEAD"    { .activity_id = 4 }
      if method == "OPTIONS" { .activity_id = 5 }
      if method == "POST"    { .activity_id = 6 }
      if method == "PUT"     { .activity_id = 7 }
      if method == "TRACE"   { .activity_id = 8 }
      if method == "PATCH"   { .activity_id = 9 }

      ipm   = parse_regex(msg, r'"Cf-Connecting-Ip":\["(?P<v>[^"]+)"\]') ?? {}
      ccm   = parse_regex(msg, r'"Cf-Ipcountry":\["(?P<v>[^"]+)"\]') ?? {}
      uam   = parse_regex(msg, r'"User-Agent":\["(?P<v>[^"]*)"\]') ?? {}
      raym  = parse_regex(msg, r'"Cf-Ray":\["(?P<v>[^"]+)"\]') ?? {}
      hostm = parse_regex(msg, r'\shost=(?P<v>\S+)') ?? {}
      pathm = parse_regex(msg, r'\spath=(?P<v>\S+)') ?? {}

      .src_endpoint = {"ip": to_string(ipm.v)}
      if exists(ccm.v) { .src_endpoint.location = {"country": to_string(ccm.v)} }
      .http_request = {
        "http_method": method,
        "url": {"path": to_string(pathm.v), "hostname": to_string(hostm.v)},
        "user_agent": to_string(uam.v)
      }
      # Inbound: an external client reaching the tunnelled service.
      .connection_info = {"direction": "Inbound", "direction_id": 1, "uid": conn_uid}
      .severity_id = 1
      if exists(raym.v) { .metadata.uid = to_string(raym.v) }
    } else if exists(respm.status) {
      status = to_int(respm.status) ?? 0
      # EVERY response becomes an event — the status code is the half of the
      # telemetry the request line cannot carry. 2xx/3xx are info; errors are
      # elevated so the 401/403/429/5xx rules ride on severity-worthy events.
      .status_code = status
      .http_response = {"code": status}
      sev = 1
      if status >= 400 { sev = 3 }
      if status >= 500 { sev = 4 }
      .severity_id = sev
      .activity_id = 0
      .connection_info = {"direction": "Inbound", "direction_id": 1, "uid": conn_uid}
    } else {
      abort
    }
    # Every event needs a stable, unique metadata.uid — the UI fetches an event's
    # detail by it, so an event without one can't be opened ("id is required").
    # Requests carry Cf-Ray; responses (and any Cf-Ray-less request) hash the
    # line PLUS the envelope's tail-time observed_at: two identical lines in the
    # same second (repeat 200s on a busy host) stay distinct events, while a
    # JetStream redelivery of the same envelope hashes identically (dedup-safe).
    if !exists(.metadata.uid) {
      ots = to_string(src.observed_at) ?? ""
      .metadata.uid = md5(msg + ots)
    }
    .raw_data = src.message
