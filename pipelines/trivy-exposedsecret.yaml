# Trivy Operator ExposedSecretReport
sourceId: "trivy-exposedsecret"
fingerprint: ""           # wildcard — applies to any fingerprint for this sourceId
family: "json"
ocsfClass: 2004
description: "Trivy Operator ExposedSecretReport"
sample: "{\"apiVersion\":\"aquasecurity.github.io/v1alpha1\",\"kind\":\"ExposedSecretReport\",\"metadata\":{\"name\":\"replicaset-app-67b77f5965-app\",\"namespace\":\"default\",\"creationTimestamp\":\"2024-08-12T13:00:00Z\",\"labels\":{\"trivy-operator.container.name\":\"app\",\"trivy-operator.resource.kind\":\"ReplicaSet\",\"trivy-operator.resource.name\":\"app-67b77f5965\",\"trivy-operator.resource.namespace\":\"default\"}},\"report\":{\"updateTimestamp\":\"2024-08-12T13:00:00Z\",\"artifact\":{\"repository\":\"myimagewithsecret\",\"tag\":\"v1.2.3\",\"digest\""
vrl: |
    # Trivy ExposedSecretReport CR -> OCSF 2004 Detection Finding
    # NOTE: report.secrets[] may have many entries; map first/severest + count.
    src = .
    parsed = {}
    if is_string(.message) {
      ok, err = parse_json(.message)
      if err == null && is_object(ok) { parsed = object!(ok) }
    }

    . = {}

    .class_uid = 2004
    .activity_id = 1
    .metadata = {"product": {"name": "Trivy", "vendor_name": "Aqua Security"}, "version": "1.5.0"}

    secrets = []
    if is_array(parsed.report.secrets) { secrets = array!(parsed.report.secrets) }
    .count = length(secrets)

    severity_rank = {"critical": 5, "high": 4, "medium": 3, "low": 2, "unknown": 1}
    worst = {}
    worst_rank = -1
    for_each(secrets) -> |_idx, v| {
      if is_object(v) {
        vo = object!(v)
        sv = vo.severity
        s = ""
        if is_string(sv) { s = downcase(string!(sv)) }
        if s == "" { s = "unknown" }
        r = to_int(get(severity_rank, [s]) ?? 0) ?? 0
        if r > worst_rank { worst_rank = r; worst = vo }
      }
    }

    sev_id = 1
    if worst_rank > 0 { sev_id = worst_rank }
    .severity_id = sev_id

    ws_raw = worst.severity
    ws = ""
    if is_string(ws_raw) { ws = downcase(string!(ws_raw)) }
    if ws == "" { ws = "unknown" }
    .severity = ws

    # Time
    ts = parsed.report.updateTimestamp
    if ts == null { ts = parsed.metadata.creationTimestamp }
    if ts == null { ts = src.timestamp }
    if ts == null { ts = now() }
    .time = ts

    .status_id = 1
    if length(secrets) > 0 { .status_id = 2 }

    .finding_info = {
      "title": worst.title,
      "uid": worst.ruleID,
      "types": [worst.category]
    }
    .message = worst.match

    .secret = {
      "rule_id": worst.ruleID,
      "category": worst.category,
      "target": worst.target,
      "match": worst.match
    }

    .resource = {
      "name": parsed.metadata.name,
      "namespace": parsed.metadata.namespace,
      "labels": parsed.metadata.labels
    }

    .image = {
      "repository": parsed.report.artifact.repository,
      "tag": parsed.report.artifact.tag,
      "digest": parsed.report.artifact.digest,
      "registry": parsed.report.registry.server
    }

    .scanner = parsed.report.scanner
    if is_object(parsed.report.summary) { .summary = parsed.report.summary }

    if is_object(src.kubernetes) { .k8s = src.kubernetes }
