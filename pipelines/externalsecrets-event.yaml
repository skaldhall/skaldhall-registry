# External Secrets Operator events (zerolog)
sourceId: "externalsecrets-event"
fingerprint: ""           # wildcard — applies to any fingerprint for this sourceId
family: "json"
ocsfClass: 7001
description: "External Secrets Operator events (zerolog)"
sample: "{\"level\":\"info\",\"ts\":\"2024-08-12T13:00:00.123Z\",\"logger\":\"controllers.ExternalSecret\",\"msg\":\"reconciled secret\",\"ExternalSecret\":{\"name\":\"db-credentials\",\"namespace\":\"prod\"},\"secretStore\":\"vault-backend\",\"syncedKeys\":[\"password\",\"username\"]}"
vrl: |
    src = .
    parsed = {}
    if is_string(.message) {
      ok, err = parse_json(string!(.message))
      if err == null {
        if is_object(ok) { parsed = object!(ok) }
      }
    }

    . = {}

    # 7001 = Entity Management
    .class_uid = 7001

    msg_str = to_string(parsed.msg) ?? ""
    msg_l = downcase(msg_str)

    # Activity by message
    activity = 0
    if contains(msg_l, "creat") { activity = 1 }
    if contains(msg_l, "reconcil") { activity = 3 }
    if contains(msg_l, "updat") { activity = 3 }
    if contains(msg_l, "validated") { activity = 3 }
    if contains(msg_l, "push") { activity = 3 }
    if contains(msg_l, "delet") { activity = 4 }
    if contains(msg_l, "fail") { activity = 0 }
    if contains(msg_l, "could not") { activity = 0 }
    .activity_id = activity

    lvl = downcase(to_string(parsed.level) ?? "info")
    sev = 1
    if lvl == "debug" { sev = 1 }
    if lvl == "info" { sev = 1 }
    if lvl == "warn" || lvl == "warning" { sev = 3 }
    if lvl == "error" { sev = 4 }
    if lvl == "fatal" || lvl == "panic" { sev = 5 }
    .severity_id = sev

    t_str = to_string(parsed.ts) ?? ""
    ts = parse_timestamp(t_str, format: "%+") ?? now()
    .time = ts

    controller = to_string(parsed.controller) ?? ""
    if controller == "" { controller = to_string(parsed.logger) ?? "" }

    # Identify the target object: ESO logs put it in a typed key like
    # ExternalSecret, SecretStore, ClusterSecretStore, PushSecret.
    target_obj = {}
    target_kind = ""
    if is_object(parsed.ExternalSecret) {
      target_obj = object!(parsed.ExternalSecret)
      target_kind = "ExternalSecret"
    }
    if is_object(parsed.SecretStore) {
      target_obj = object!(parsed.SecretStore)
      target_kind = "SecretStore"
    }
    if is_object(parsed.ClusterSecretStore) {
      target_obj = object!(parsed.ClusterSecretStore)
      target_kind = "ClusterSecretStore"
    }
    if is_object(parsed.PushSecret) {
      target_obj = object!(parsed.PushSecret)
      target_kind = "PushSecret"
    }
    if is_object(parsed.object) {
      target_obj = object!(parsed.object)
      if target_kind == "" { target_kind = "object" }
    }

    .metadata = {
      "product": {"name": "external-secrets", "vendor_name": "external-secrets.io"},
      "version": "1.5.0",
      "uid": ""
    }

    .actor = {
      "process": {"name": controller}
    }

    .entity = {
      "type": target_kind,
      "name": target_obj.name,
      "namespace": target_obj.namespace
    }

    .message = msg_str
    .level = parsed.level
    .logger = parsed.logger
    .controller = controller
    .target = target_obj
    .target_kind = target_kind
    .error = parsed.error
    .stacktrace = parsed.stacktrace
    .secret_store = parsed.secretStore
    .synced_keys = parsed.syncedKeys
    .secret = parsed.secret
    .provider = parsed.provider
    .status = parsed.status
    .refresh_interval = parsed.refreshInterval
    .last_sync = parsed.lastSync
    .push_target = parsed.target
    .raw_data = parsed
