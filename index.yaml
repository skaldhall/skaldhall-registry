      }
      .severity_id = sev_id
      wsev_raw = worst.severity
      wsev = ""
      if is_string(wsev_raw) { wsev = downcase(string!(wsev_raw)) }
      if wsev == "" { wsev = "unknown" }
      .severity = wsev

      # Time
      ts = parsed.report.updateTimestamp
      if ts == null { ts = parsed.metadata.creationTimestamp }
      if ts == null { ts = src.timestamp }
      if ts == null { ts = now() }
      .time = ts

      .status_id = 1
      if length(vulns) > 0 { .status_id = 2 }

      # Vulnerability finding info
      .vulnerabilities = [{
        "cve": {
          "uid": worst.vulnerabilityID,
          "title": worst.title,
          "references": worst.links
        },
        "severity": .severity,
        "first_seen_time": worst.publishedDate,
        "last_seen_time": worst.lastModifiedDate,
        "affected_packages": [{
          "name": worst.resource,
          "version": worst.installedVersion,
          "fixed_in_version": worst.fixedVersion,
          "package_manager": worst.packageType
        }],
        "is_fix_available": worst.fixedVersion != null && worst.fixedVersion != ""
      }]

      .finding_info = {
        "title": worst.vulnerabilityID,
        "uid": worst.vulnerabilityID,
        "types": [worst.class],
        "src_url": worst.primaryLink
      }
      .message = worst.title

      # Resource (image artifact)
      .resource = {
        "name": parsed.metadata.name,
        "namespace": parsed.metadata.namespace,
        "labels": parsed.metadata.labels
      }

      # Image / artifact
      .image = {
        "repository": parsed.report.artifact.repository,
        "tag": parsed.report.artifact.tag,
        "digest": parsed.report.artifact.digest,
        "registry": parsed.report.registry.server
      }

      # Scanner
      .scanner = parsed.report.scanner

      # Summary
      if is_object(parsed.report.summary) { .summary = parsed.report.summary }

      if is_object(src.kubernetes) { .k8s = src.kubernetes }
  - sourceId: "vault-audit"
    fingerprint: ""
    family: "json"
    ocsfClass: 6003
    description: "HashiCorp Vault audit log"
    vrl: |
      src = .
      parsed = {}
      if is_string(.message) {
        ok, err = parse_json(string!(.message))
        if err == null {
          if is_object(ok) { parsed = object!(ok) }
        }
      }

      . = {}

      # 6003 = API Activity
      .class_uid = 6003

      # request type → activity
      type_v = to_string(parsed.type) ?? ""
      auth_obj = {}
      if is_object(parsed.auth) { auth_obj = object!(parsed.auth) }
      req_obj = {}
      if is_object(parsed.request) { req_obj = object!(parsed.request) }
      resp_obj = {}
      if is_object(parsed.response) { resp_obj = object!(parsed.response) }

      operation = to_string(req_obj.operation) ?? ""
      op_l = downcase(operation)

      # OCSF API activity_id: 1 Create, 2 Read, 3 Update, 4 Delete, 6 Other
      activity = 6
      if op_l == "read" { activity = 2 }
      if op_l == "list" { activity = 2 }
      if op_l == "create" { activity = 1 }
      if op_l == "update" { activity = 3 }
      if op_l == "patch" { activity = 3 }
      if op_l == "delete" { activity = 4 }
      .activity_id = activity

      # severity: error → high, otherwise info
      sev = 1
      err_v = to_string(parsed.error) ?? ""
      if err_v != "" { sev = 4 }
      .severity_id = sev

      # time
      t_str = to_string(parsed.time) ?? ""
      ts = parse_timestamp(t_str, format: "%+") ?? now()
      .time = ts

      .metadata = {
        "product": {"name": "vault", "vendor_name": "HashiCorp"},
        "version": "1.5.0",
        "uid": to_string(req_obj.id) ?? ""
      }

      # actor / user
      .actor = {
        "user": {
          "name": auth_obj.display_name,
          "uid": auth_obj.accessor,
          "groups": auth_obj.policies
        }
      }

      # src endpoint
      remote_ip = to_string(req_obj.remote_address) ?? ""
      remote_port = to_int(req_obj.remote_port) ?? 0
      .src_endpoint = {
        "ip": remote_ip,
        "port": remote_port
      }

      # api block
      .api = {
        "operation": operation,
        "service": {"name": "vault"},
        "request": {
          "uid": to_string(req_obj.id) ?? "",
          "uri": to_string(req_obj.path) ?? ""
        }
      }

      # status from type (request/response)
      .status = type_v
      if err_v != "" {
        .status = "error"
        .status_detail = err_v
      }

      # Token policies / extra fields
      .auth = {
        "client_token": auth_obj.client_token,
        "accessor": auth_obj.accessor,
        "display_name": auth_obj.display_name,
        "policies": auth_obj.policies,
        "token_policies": auth_obj.token_policies,
        "token_type": auth_obj.token_type,
        "metadata": auth_obj.metadata
      }

      ns_obj = {}
      if is_object(req_obj.namespace) { ns_obj = object!(req_obj.namespace) }

      .request = {
        "id": req_obj.id,
        "operation": operation,
        "mount_type": req_obj.mount_type,
        "mount_accessor": req_obj.mount_accessor,
        "path": req_obj.path,
        "namespace": ns_obj,
        "client_token": req_obj.client_token,
        "client_token_accessor": req_obj.client_token_accessor,
        "remote_address": remote_ip,
        "remote_port": remote_port,
        "data": req_obj.data
      }

      .response = {
        "mount_type": resp_obj.mount_type,
        "data": resp_obj.data,
        "auth": resp_obj.auth
      }

      .error = err_v
      .audit_type = type_v
      .message = "vault " + type_v + " " + operation + " " + (to_string(req_obj.path) ?? "")
      .raw_data = parsed
  - sourceId: "zeek"
    fingerprint: ""
    family: "json"
    ocsfClass: 4001
    description: "Zeek conn/dns/http JSON logs"
    vrl: |
      # Zeek log -> OCSF (multi-class branch by record shape / _path)
      src = .
      parsed = {}
      if is_string(.message) {
        ok, err = parse_json(.message)
        if err == null && is_object(ok) { parsed = object!(ok) }
      }

      . = {}

      .metadata = {"product": {"name": "Zeek", "vendor_name": "Zeek"}, "version": "1.5.0"}

      t = parsed.ts
      if t == null { t = src.timestamp }
      if t == null { t = now() }
      .time = t

      # Determine path: explicit _path wins; else infer from fields.
      path = to_string(parsed._path) ?? ""
      if path == "" {
        if exists(parsed.method) || exists(parsed.uri) || exists(parsed.status_code) {
          path = "http"
        } else if exists(parsed.query) || exists(parsed.qtype_name) || exists(parsed.rcode_name) {
          path = "dns"
        } else if exists(parsed.conn_state) || exists(parsed.orig_ip_bytes) {
          path = "conn"
        }
      }
      .zeek_path = path

      # Common 5-tuple
      src_ep = {
        "ip": parsed."id.orig_h",
        "port": parsed."id.orig_p"
      }
      dst_ep = {
        "ip": parsed."id.resp_h",
        "port": parsed."id.resp_p"
      }

      .class_uid = 4001
      .activity_id = 0
      .severity_id = 1
      .connection_info = {"protocol_name": parsed.proto, "service": parsed.service}

      if path == "conn" {
        .class_uid = 4001
        state = to_string(parsed.conn_state) ?? ""
        .activity_id = 1
        if state == "SF" || state == "S1" || state == "RSTO" || state == "RSTR" { .activity_id = 2 }
        if state == "REJ" { .activity_id = 5; .severity_id = 3 }
        if state == "S0" { .severity_id = 2 }
        .traffic = {
          "bytes_in": parsed.resp_bytes,
          "bytes_out": parsed.orig_bytes,
          "packets_in": parsed.resp_pkts,
          "packets_out": parsed.orig_pkts
        }
        .duration = parsed.duration
        .conn_state = parsed.conn_state
        .history = parsed.history
        .missed_bytes = parsed.missed_bytes
        .orig_ip_bytes = parsed.orig_ip_bytes
        .resp_ip_bytes = parsed.resp_ip_bytes
        .ip_proto = parsed.ip_proto
        .local_orig = parsed.local_orig
        .local_resp = parsed.local_resp
      } else if path == "dns" {
        .class_uid = 4003
        qr = parsed.qtype_name
        .activity_id = 1
        if exists(parsed.answers) || exists(parsed.rcode_name) { .activity_id = 2 }
        rc = to_string(parsed.rcode_name) ?? ""
        if rc == "SERVFAIL" || rc == "REFUSED" { .severity_id = 3 }
        .dns = {
          "id": parsed.trans_id,
          "question": {"name": parsed.query, "type": parsed.qtype_name, "class": parsed.qclass_name},
          "response": {"rcode": parsed.rcode_name, "rcode_id": parsed.rcode, "answers": parsed.answers, "ttls": parsed.TTLs},
          "flags": {"AA": parsed.AA, "TC": parsed.TC, "RD": parsed.RD, "RA": parsed.RA, "Z": parsed.Z, "rejected": parsed.rejected, "opcode": parsed.opcode_name}
        }
        .rtt = parsed.rtt
      } else if path == "http" {
        .class_uid = 4002
        status, _ = to_int(parsed.status_code)
        if status == null { status = 0 }
        .activity_id = 1
        if status >= 500 { .severity_id = 4 }
        if status >= 400 && status < 500 { .severity_id = 3 }
        if status >= 200 && status < 400 { .severity_id = 1 }
        .http_request = {
          "method": parsed.method,
          "url": {"path": parsed.uri, "hostname": parsed.host},
          "version": parsed.version,
          "user_agent": parsed.user_agent,
          "body_length": parsed.request_body_len
        }
        .http_response = {
          "status_code": parsed.status_code,
          "status_msg": parsed.status_msg,
          "length": parsed.response_body_len,
          "mime_types": parsed.resp_mime_types,
          "fuids": parsed.resp_fuids
        }
        .trans_depth = parsed.trans_depth
        .tags = parsed.tags
      }

      .src_endpoint = src_ep
      .dst_endpoint = dst_ep
      .uid = parsed.uid
      .message = src.message
