# Auto-generated by scripts/build-index.sh from pipelines/*.yaml.
# Edit pipelines/<src>.yaml and re-run the script.
pipelines:
  - sourceId: "antrea-flow"
    fingerprint: ""
    family: "json"
    ocsfClass: 4001
    description: "Antrea Flow Aggregator JSONL"
    vrl: |
      # Antrea flow (IPFIX-derived JSON) -> OCSF 4001 Network Activity
      src = .
      parsed = {}
      if is_string(.message) {
        ok, err = parse_json(.message)
        if err == null && is_object(ok) { parsed = object!(ok) }
      }

      . = {}

      .class_uid = 4001
      .metadata = {"product": {"name": "Antrea", "vendor_name": "Antrea"}, "version": "1.5.0"}

      t = parsed.flowEndSeconds
      if t == null { t = parsed.flowStartSeconds }
      if t == null { t = src.timestamp }
      if t == null { t = now() }
      .time = t
      .start_time = parsed.flowStartSeconds
      .end_time = parsed.flowEndSeconds

      # Action via ingressNetworkPolicyRuleAction (1=Allow,2=Drop,3=Reject)
      action = parsed.ingressNetworkPolicyRuleAction
      .activity_id = 1
      .severity_id = 1
      if action == 2 { .activity_id = 5; .severity_id = 4 }
      if action == 3 { .activity_id = 5; .severity_id = 4 }

      # Endpoints
      src_ip = parsed.sourceIPv4Address
      if src_ip == null || src_ip == "" { src_ip = parsed.sourceIPv6Address }
      dst_ip = parsed.destinationIPv4Address
      if dst_ip == null || dst_ip == "" { dst_ip = parsed.destinationIPv6Address }

      .src_endpoint = {
        "ip": src_ip,
        "port": parsed.sourceTransportPort,
        "name": parsed.sourcePodName,
        "namespace": parsed.sourcePodNamespace,
        "node_name": parsed.sourceNodeName,
        "labels": parsed.sourcePodLabels
      }
      .dst_endpoint = {
        "ip": dst_ip,
        "port": parsed.destinationTransportPort,
        "name": parsed.destinationPodName,
        "namespace": parsed.destinationPodNamespace,
        "node_name": parsed.destinationNodeName,
        "labels": parsed.destinationPodLabels,
        "service_port": parsed.destinationServicePort,
        "service_port_name": parsed.destinationServicePortName
      }

      # Protocol map
      proto = parsed.protocolIdentifier
      proto_name = "unknown"
      if proto == 6  { proto_name = "tcp" }
      if proto == 17 { proto_name = "udp" }
      if proto == 1  { proto_name = "icmp" }
      if proto == 132 { proto_name = "sctp" }
      .connection_info = {
        "protocol_num": proto,
        "protocol_name": proto_name,
        "tcp_state": parsed.tcpState
      }

      .traffic = {
        "bytes": parsed.octetTotalCount,
        "packets": parsed.packetTotalCount,
        "bytes_in": parsed.reverseOctetTotalCount,
        "bytes_out": parsed.octetTotalCount,
        "packets_in": parsed.reversePacketTotalCount,
        "packets_out": parsed.packetTotalCount
      }

      .policy = {
        "ingress_name": parsed.ingressNetworkPolicyName,
        "ingress_namespace": parsed.ingressNetworkPolicyNamespace,
        "ingress_type": parsed.ingressNetworkPolicyType,
        "ingress_rule_name": parsed.ingressNetworkPolicyRuleName,
        "ingress_rule_action": parsed.ingressNetworkPolicyRuleAction,
        "egress_name": parsed.egressNetworkPolicyName,
        "egress_namespace": parsed.egressNetworkPolicyNamespace
      }

      .flow_type = parsed.flowType
      .flow_end_reason = parsed.flowEndReason
      .throughput = parsed.throughput
      .reverse_throughput = parsed.reverseThroughput
      .packet_delta_count = parsed.packetDeltaCount
      .octet_delta_count = parsed.octetDeltaCount
      .reverse_packet_delta_count = parsed.reversePacketDeltaCount
      .reverse_octet_delta_count = parsed.reverseOctetDeltaCount

      .message = src.message
  - sourceId: "apparmor"
    fingerprint: ""
    family: "kv"
    ocsfClass: 1001
    description: "Linux kernel AppArmor audit"
    vrl: |
      # AppArmor LSM kernel audit -> OCSF 1001 File Activity (mostly file/exec/cap denials)
      src = .
      raw = string(.message) ?? ""

      # Strip kernel/audit prefix: "audit: type=1400 audit(epoch:seq):" then rest
      header = parse_regex(raw, r'(?:kernel:\s*)?(?:audit:\s*)?type=(?P<type>\S+)\s+audit\((?P<epoch>\d+\.\d+):(?P<seq>\d+)\):\s*(?P<rest>.*)$') ?? {}
      rest = string(header.rest) ?? ""

      # Time from epoch
      epoch_str = string(header.epoch) ?? ""
      parsed_ts = null
      if epoch_str != "" {
        ef = to_float(epoch_str) ?? 0.0
        pt, terr = from_unix_timestamp(to_int(ef * 1000000.0), unit: "microseconds")
        if terr == null { parsed_ts = pt }
      }
      if parsed_ts == null { parsed_ts = src.timestamp }
      if parsed_ts == null { parsed_ts = now() }

      # AppArmor lines are k=v with quoted values
      kv = parse_key_value(rest, key_value_delimiter: "=", field_delimiter: " ", whitespace: "lenient") ?? {}

      . = {}
      .metadata = {"product": {"name": "AppArmor", "vendor_name": "Canonical"}, "version": "1.5.0"}
      .time = parsed_ts

      aa_state = string(kv.apparmor) ?? ""
      op = string(kv.operation) ?? ""

      # Class & activity
      class_uid = 1001  # File Activity default
      activity_id = 1
      if op == "open" || op == "read" { activity_id = 2 }
      if op == "write" || op == "rename" || op == "mknod" { activity_id = 3 }
      if op == "unlink" { activity_id = 4 }
      if op == "exec" { class_uid = 1007; activity_id = 1 }   # Process Activity
      if op == "ptrace" { class_uid = 1007; activity_id = 4 }
      if op == "capable" { class_uid = 1007; activity_id = 1 }
      if op == "connect" { class_uid = 4001; activity_id = 1 }   # Network
      if op == "profile_load" { class_uid = 6002; activity_id = 1 }  # Module Activity-ish
      .class_uid = class_uid
      .activity_id = activity_id

      # Severity - DENIED is bad, ALLOWED informational
      sev = 1
      if aa_state == "DENIED" { sev = 4 }
      if aa_state == "ALLOWED" { sev = 1 }
      if aa_state == "STATUS" { sev = 1 }
      .severity_id = sev
      .status = aa_state
      status_id = 1
      if aa_state == "DENIED" { status_id = 2 }
      .status_id = status_id

      # File
      .file = {
        "path": kv.name,
        "name": kv.name
      }

      # Process
      .process = {
        "pid": to_int(kv.pid) ?? 0,
        "name": kv.comm
      }

      # Actor user
      .actor = {
        "user": {
          "uid": to_int(kv.fsuid) ?? null
        }
      }

      # AppArmor specifics
      .apparmor = {
        "state": aa_state,
        "operation": op,
        "profile": kv.profile,
        "target": kv.target,
        "requested_mask": kv.requested_mask,
        "denied_mask": kv.denied_mask,
        "capability": kv.capability,
        "capname": kv.capname,
        "peer": kv.peer,
        "family": kv.family,
        "sock_type": kv.sock_type,
        "protocol": kv.protocol,
        "addr": kv.addr,
        "port": kv.port,
        "event_id": header.seq
      }

      .raw_data = raw
