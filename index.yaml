        if is_object(c) {
          co = object!(c)
          tests = co.tests
          if is_array(tests) {
            for_each(array!(tests)) -> |_ti, t| {
              if is_object(t) {
                to = object!(t)
                rs = to.results
                if is_array(rs) {
                  for_each(array!(rs)) -> |_ri, r| {
                    if is_object(r) {
                      ro = object!(r)
                      total = total + 1
                      st = ro.status
                      if length(keys(first_any)) == 0 {
                        first_any = ro
                        ctrl_meta = co
                        test_meta = to
                      }
                      if st == "FAIL" {
                        fail_count = fail_count + 1
                        if length(keys(first_fail)) == 0 {
                          first_fail = ro
                          ctrl_meta = co
                          test_meta = to
                        }
                      }
                      if st == "WARN" { warn_count = warn_count + 1 }
                    }
                  }
                }
              }
            }
          }
        }
      }

      pick = first_fail
      if length(keys(pick)) == 0 { pick = first_any }

      .count = total
      .fail_count = fail_count
      .warn_count = warn_count

      # Severity / status by chosen result status
      status = pick.status
      sev_id = 1
      status_id = 1
      if status == "FAIL" { sev_id = 4; status_id = 2 }
      if status == "WARN" { sev_id = 3; status_id = 2 }
      if status == "INFO" { sev_id = 1 }
      .severity_id = sev_id
      .status_id = status_id
      .status = status

      .finding_info = {
        "title": pick.test_desc,
        "uid": pick.test_number,
        "types": [test_meta.desc]
      }

      .compliance = {
        "standards": [ctrl_meta.version],
        "control": pick.test_number,
        "section": test_meta.section,
        "node_type": ctrl_meta.node_type,
        "detected_version": ctrl_meta.detected_version,
        "expected": pick.expected_result,
        "actual": pick.actual_value,
        "remediation": pick.remediation,
        "scored": pick.scored
      }

      .message = pick.test_desc

      if is_object(parsed.totals) { .summary = parsed.totals }

      if is_object(src.kubernetes) { .k8s = src.kubernetes }
