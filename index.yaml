  - sourceId: "certmanager"
    fingerprint: ""
    family: "json"
    ocsfClass: 6002
    description: "cert-manager controller log (zap)"
    vrl: |
      src = .
      parsed = {}
      if is_string(.message) {
        ok, err = parse_json(string!(.message))
        if err == null {
          if is_object(ok) { parsed = object!(ok) }
        }
      }

      . = {}

      # 6002 = Application Lifecycle
      .class_uid = 6002

      msg_str = to_string(parsed.msg) ?? ""
      msg_l = downcase(msg_str)

      # Activity: 1 install, 2 remove, 3 start, 4 stop, 5 restart, 6 enable, 7 disable, 8 update, 0 unknown
      activity = 0
      if contains(msg_l, "starting") { activity = 3 }
      if contains(msg_l, "issued") { activity = 1 }
      if contains(msg_l, "verified") { activity = 3 }
      if contains(msg_l, "re-issued") { activity = 8 }
      if contains(msg_l, "renew") { activity = 8 }
      if contains(msg_l, "up to date") { activity = 3 }
      if contains(msg_l, "fail") { activity = 0 }
      .activity_id = activity

      lvl = downcase(to_string(parsed.level) ?? "info")
      sev = 1
      if lvl == "debug" { sev = 1 }
      if lvl == "info" { sev = 1 }
      if lvl == "warn" || lvl == "warning" { sev = 3 }
      if lvl == "error" { sev = 4 }
      if lvl == "fatal" || lvl == "panic" { sev = 5 }
      .severity_id = sev

      t_str = to_string(parsed.ts) ?? ""
      ts = parse_timestamp(t_str, format: "%+") ?? now()
      .time = ts

      logger = to_string(parsed.logger) ?? ""
      controller = to_string(parsed.controller) ?? ""

      resource_obj = {}
      if is_object(parsed.resource) { resource_obj = object!(parsed.resource) }

      .metadata = {
        "product": {"name": "cert-manager", "vendor_name": "cert-manager.io"},
        "version": "1.5.0",
        "uid": to_string(resource_obj.name) ?? ""
      }

      .actor = {
        "process": {"name": logger}
      }

      .entity = {
        "type": "Certificate",
        "name": resource_obj.name,
        "namespace": resource_obj.namespace
      }

      .message = msg_str
      .level = parsed.level
      .logger = logger
      .controller = controller
      .resource = resource_obj
      .reason = parsed.reason
      .reason_message = parsed.reasonMessage
      .error = parsed.error
      .dns_name = parsed.dnsName
      .challenge_type = parsed.type
      .order = parsed.order
      .not_before = parsed.notBefore
      .not_after = parsed.notAfter
      .common_name = parsed.commonName
      .dns_names = parsed.dnsNames
      .renewal_time = parsed.renewalTime
      .worker_count = parsed."worker count"
      .raw_data = parsed
  - sourceId: "coraza"
    fingerprint: ""
    family: "json"
    ocsfClass: 2004
    description: "Coraza WAF audit JSON"
    vrl: |
      # Coraza WAF audit log -> OCSF 2004 Detection Finding
      src = .
      parsed = parse_json(string(.message) ?? "") ?? {}

      . = {}
      .class_uid = 2004
      .metadata = {"product": {"name": "Coraza", "vendor_name": "OWASP/Coraza"}, "version": "1.5.0"}

      txn = object(parsed.transaction) ?? {}

      # Time
      ts_str = string(txn.timestamp) ?? ""
      parsed_ts = null
      if ts_str != "" {
        pt, perr = parse_timestamp(ts_str, "%+")
        if perr == null { parsed_ts = pt }
      }
      if parsed_ts == null { parsed_ts = src.timestamp }
      if parsed_ts == null { parsed_ts = now() }
      .time = parsed_ts

      # Determine severity from highest message severity, default 1
      msg_array = array(txn.messages) ?? []

      sev = 1
      .activity_id = 1
      hit_count = length(msg_array)
      if hit_count > 0 {
        # Highest severity
        for_each(msg_array) -> |_idx, m| {
          msev = downcase(string(m.rule.severity) ?? "")
          if msev == "notice"   && sev < 1 { sev = 1 }
          if msev == "warning"  && sev < 2 { sev = 2 }
          if msev == "error"    && sev < 3 { sev = 3 }
          if msev == "critical" && sev < 4 { sev = 4 }
          if msev == "alert"    && sev < 5 { sev = 5 }
          if msev == "emergency" && sev < 6 { sev = 6 }
        }
      }
      # If no messages, log was clean
      if hit_count == 0 { sev = 1 }
      .severity_id = sev

      # Detection finding fields - take first message as primary
      findings = []
      for_each(msg_array) -> |_idx, m| {
        rule_obj = object(m.rule) ?? {}
        fitem = {
          "rule_id": rule_obj.id,
          "rule_name": rule_obj.msg,
          "rule_version": rule_obj.ver,
          "rule_file": rule_obj.file,
          "rule_line": rule_obj.line,
          "severity": rule_obj.severity,
          "tags": rule_obj.tags,
          "message": m.message,
          "data": m.data,
          "action": m.actionset.action,
          "phase": m.actionset.phase
        }
        findings = push(findings, fitem)
      }
      .findings = findings

      # Primary rule (for top-level fields)
      if hit_count > 0 {
        m0 = msg_array[0]
        rule0 = object(m0.rule) ?? {}
        .finding_info = {
          "title": m0.message,
          "uid": rule0.id,
          "types": rule0.tags
        }
        status_id = 1
        action_str = string(m0.actionset.action) ?? ""
        if action_str == "deny" || action_str == "drop" { status_id = 1 }
        if action_str == "allow" { status_id = 2 }
        .status_id = status_id
        .status = action_str
      }

      # Source/dest endpoints
      .src_endpoint = {
        "ip": txn.client_ip,
        "port": to_int(txn.client_port) ?? 0
      }
      .dst_endpoint = {
        "ip": txn.host_ip,
        "port": to_int(txn.host_port) ?? 0
      }

      # HTTP request context
      req = object(txn.request) ?? {}
      resp = object(txn.response) ?? {}
      .http_request = {
        "http_method": req.method,
        "url": {"path": req.uri},
        "version": req.http_version,
        "headers": req.headers
      }
      .http_response = {
        "code": to_int(resp.status) ?? 0
      }

      .transaction_id = txn.id
      .producer = txn.producer
      .raw_data = src.message
  - sourceId: "cosign-verify"
    fingerprint: ""
    family: "json"
    ocsfClass: 2004
    description: "Sigstore cosign verify log"
    vrl: |
      # Cosign verify output -> OCSF 2004 Detection Finding
      # Multiple input shapes:
      #  - Verification banner (plain text "Verification for ...")
      #  - JSON array of signature payloads (the verified-claims dump)
      #  - JSON log lines from cosign cli (level/msg/image)
      #  - Plain error lines ("Error: ..." / "main.go:62: error during ...")
      src = .
      parsed = {}
      parsed_arr_first = {}
      parsed_is_array = false
      parsed_ok = false
      if is_string(.message) {
        m = string!(.message)
        ok, err = parse_json(m)
        if err == null {
          parsed_ok = true
          if is_array(ok) {
            parsed_is_array = true
            arr = array!(ok)
            if length(arr) > 0 {
              a0 = arr[0]
              if is_object(a0) { parsed_arr_first = object!(a0) }
            }
          }
          if is_object(ok) { parsed = object!(ok) }
        }
      }

      raw_msg = ""
      if is_string(.message) { raw_msg = string!(.message) }

      . = {}

      .class_uid = 2004
      .activity_id = 1
      .metadata = {"product": {"name": "Cosign", "vendor_name": "Sigstore"}, "version": "1.5.0"}

      # Time
      ts = parsed.time
      if ts == null { ts = parsed.ts }
      if ts == null { ts = src.timestamp }
      if ts == null { ts = now() }
      .time = ts

      # Determine status from msg/level/raw text
      level_raw = parsed.level
      level = ""
      if is_string(level_raw) { level = string!(level_raw) }

      m_raw = parsed.msg
      if m_raw == null { m_raw = parsed.message }
      m_str = ""
      if is_string(m_raw) { m_str = string!(m_raw) }

      is_error = false
      if level == "error" { is_error = true }
      if contains(raw_msg, "Error:") { is_error = true }
      if contains(raw_msg, "no matching signatures") { is_error = true }
      if contains(raw_msg, "no signatures found") { is_error = true }

      sev_id = 1
      status_id = 1
      if is_error {
        sev_id = 4
        status_id = 2
      }
      .severity_id = sev_id
      .status_id = status_id

      # Image extraction
      img = parsed.image
      if img == null && parsed_is_array {
        img = parsed_arr_first.critical.image."docker-manifest-digest"
        if img == null { img = parsed_arr_first.critical.identity."docker-reference" }
      }
      .image = {"name": img}

      # Cert / signing identity (keyless)
      .signing = {
        "certificate_identity": parsed.certificate_identity,
        "certificate_issuer": parsed.certificate_issuer
      }

      # Cosign claim/bundle
      if parsed_is_array {
        .claim = parsed_arr_first.critical
        .bundle = parsed_arr_first.optional.Bundle
      }

      .message = m_str
      if .message == "" { .message = raw_msg }
      .level = level
      .parse_ok = parsed_ok

      .finding_info = {
        "title": "cosign verification",
        "uid": img
      }

      if is_object(src.kubernetes) { .k8s = src.kubernetes }
  - sourceId: "crowdsec"
    fingerprint: ""
