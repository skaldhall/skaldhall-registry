      if audit_type == "EXECVE"  { class_uid = 1007; activity_id = 1 }
      if audit_type == "PATH"    { class_uid = 1001; activity_id = 1 }
      if audit_type == "USER_LOGIN" { class_uid = 3002; activity_id = 1 }
      if audit_type == "USER_AUTH"  { class_uid = 3002; activity_id = 1 }
      if audit_type == "ANOM_ABEND" { class_uid = 1007; activity_id = 4; severity_id = 4 }
      if audit_type == "ADD_USER"   { class_uid = 3001; activity_id = 1; severity_id = 3 }
